name: CI

# The shared module on its own: it compiles for the desktop JVM and Android,
# and the build logic compiles. Each game app tests it again in its own build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK licences
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null || true
      - name: Build
        run: ./gradlew --no-daemon :platform:compileKotlinDesktop :platform:compileAndroidMain

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test (portable, and AVX2)
        run: |
          cmake -B build -S cpp -DCMAKE_BUILD_TYPE=Release && cmake --build build -j && ctest --test-dir build --output-on-failure
          cmake -B build-avx -S cpp -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-mavx2 -mfma" && cmake --build build-avx -j && ctest --test-dir build-avx --output-on-failure

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies (CPU torch)
        run: pip install numpy pytest pybind11 torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: The toy game's module
        run: |
          cmake -B build-py -S cpp -DCMAKE_BUILD_TYPE=Release -DCARDBOT_PYTHON=ON -Dpybind11_DIR=$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')
          cmake --build build-py -j --target mini_tricks_cpp
      - name: Tests
        working-directory: python
        run: PYTHONPATH=../build-py:. python -m pytest -q -s tests

