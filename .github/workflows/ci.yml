name: CI

# The shared module on its own: it compiles for the desktop JVM and Android,
# and the build logic compiles. Each game app tests it again in its own build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK licences
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null || true
      - name: Build
        run: ./gradlew --no-daemon :platform:compileKotlinDesktop :platform:compileAndroidMain
